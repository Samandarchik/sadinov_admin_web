services:
  admin-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://31.187.74.228:8001}
        VITE_BASE_HREF: ${VITE_BASE_HREF:-/}
    container_name: sadinov-admin-web
    restart: unless-stopped
    ports:
      - "8800:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
